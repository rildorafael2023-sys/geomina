[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "geomina"
version = "0.3.0"
description = "GeoMina — gestão de dados geológicos de mina subterrânea (aplicativo local)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13",
  "pydantic-settings>=2.3",
  "argon2-cffi>=23.1",
  "python-multipart>=0.0.9",
  "shapely>=2.0",
  "pyproj>=3.6",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
geomina = "geomina.__main__:main"

[tool.setuptools.packages.find]
include = ["geomina*"]

[tool.setuptools.package-data]
geomina = ["migrations/*.py", "migrations/versions/*.py", "migrations/script.py.mako", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: Depends() em parâmetros é o padrão do FastAPI.
ignore = ["B008"]
[tool.ruff.lint.per-file-ignores]
"geomina/migrations/versions/*" = ["E501", "W291", "I001", "UP"]
"tests/*" = ["E501"]
